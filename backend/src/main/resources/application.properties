spring.application.name=backend

# Active profile — override by setting SPRING_PROFILES_ACTIVE env var
# Defaults to "local" so plain `./mvnw spring-boot:run` uses Docker datasource
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# Flyway
spring.flyway.enabled=true
spring.flyway.out-of-order=true

# JWT
jwt.secret=${JWT_SECRET:rtms-secret-key-2026-doan-swp391-khong-duoc-de-lo-ra-ngoai-nhe}
jwt.access-expiration=1800000
jwt.refresh-expiration=604800000

# Uploaded files (admission documents, incident images).
# Local disk by default; set CLOUDINARY_URL to store them on Cloudinary instead.
rtms.storage.upload-dir=${RTMS_STORAGE_UPLOAD_DIR:${RTMS_ADMISSION_UPLOAD_DIR:./uploads/admissions}}
rtms.storage.cloudinary-url=${CLOUDINARY_URL:}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=81MB
